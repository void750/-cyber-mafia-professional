<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>☠️ Cyber Mafia Professional</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
color:#ecfff3;
background:
radial-gradient(circle at 20% 10%,#123b27 0,#07110b 35%,#020403 80%);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:430px;
background:rgba(7,15,10,.96);
border:1px solid #285f3f;
border-radius:22px;
padding:30px;
box-shadow:
0 0 70px rgba(69,255,154,.10),
inset 0 0 30px rgba(69,255,154,.025);
}

.logo{
text-align:center;
font-size:31px;
font-weight:900;
letter-spacing:3px;
color:#45ff9a;
}

.sub{
text-align:center;
margin-top:8px;
margin-bottom:28px;
font-size:11px;
letter-spacing:2px;
color:#75917f;
}

.tabs{
display:flex;
margin-bottom:20px;
}

.tabs button{
flex:1;
padding:12px;
border:1px solid #234831;
background:#0b1710;
color:#718c7b;
cursor:pointer;
}

.tabs button:first-child{
border-radius:9px 0 0 9px;
}

.tabs button:last-child{
border-radius:0 9px 9px 0;
}

.tabs button.active{
background:#10291a;
border-color:#45ff9a;
color:#45ff9a;
}

form{
display:grid;
gap:11px;
}

input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #294936;
background:#040805;
color:white;
outline:none;
}

input:focus{
border-color:#45ff9a;
box-shadow:0 0 0 2px rgba(69,255,154,.08);
}

.primary{
padding:14px;
border:0;
border-radius:10px;
background:#45ff9a;
color:#031008;
font-weight:900;
cursor:pointer;
}

.primary:hover{
filter:brightness(1.08);
}

.hidden{
display:none!important;
}

.message{
min-height:20px;
margin-top:13px;
text-align:center;
font-size:13px;
color:#ffbd68;
}

.security{
margin-top:25px;
padding:13px;
border:1px dashed #294936;
border-radius:10px;
color:#718a79;
font-size:11px;
line-height:1.6;
text-align:center;
}

.footer{
margin-top:20px;
text-align:center;
font-size:10px;
color:#405a49;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
☠️ CYBER MAFIA
</div>

<div class="sub">
PROFESSIONAL CYBERSECURITY ACADEMY
</div>


<div class="tabs">

<button id="loginTab"
class="active"
onclick="showLogin()">
ENTRAR
</button>

<button id="registerTab"
onclick="showRegister()">
CADASTRO
</button>

</div>


<!-- LOGIN -->

<form id="loginForm"
onsubmit="event.preventDefault();login();">

<input
id="loginUser"
type="text"
placeholder="Usuário"
autocomplete="username"
required
>

<input
id="loginPassword"
type="password"
placeholder="Senha"
autocomplete="current-password"
required
>

<button
class="primary"
type="submit">
ENTRAR NA ACADEMIA
</button>

</form>


<!-- CADASTRO -->

<form
id="registerForm"
class="hidden"
onsubmit="event.preventDefault();register();">

<input
id="registerName"
type="text"
placeholder="Nome completo"
required
>

<input
id="registerUser"
type="text"
placeholder="Escolha seu usuário"
required
>

<input
id="registerPassword"
type="password"
placeholder="Crie uma senha"
minlength="6"
required
>

<input
id="registerPassword2"
type="password"
placeholder="Confirme a senha"
minlength="6"
required
>

<button
class="primary"
type="submit">
CRIAR CONTA
</button>

</form>


<div
id="message"
class="message">
</div>


<div class="security">

🔐 Login protegido por usuário e senha.<br>
Não existe chave de acesso para o aluno.<br>
<br>
☠️ Cyber Mafia Professional

</div>


<div class="footer">
Sistema educacional de cibersegurança
</div>

</div>


<script>

/* =========================================================
   CYBER MAFIA — AUTENTICAÇÃO LOCAL
   A AUTENTICAÇÃO ONLINE SERÁ LIGADA AO SUPABASE
   NA PRÓXIMA ETAPA.
   ========================================================= */


/* ---------- ELEMENTOS ---------- */

const loginForm=
document.getElementById("loginForm");

const registerForm=
document.getElementById("registerForm");

const loginTab=
document.getElementById("loginTab");

const registerTab=
document.getElementById("registerTab");

const message=
document.getElementById("message");


/* ---------- TELA LOGIN ---------- */

function showLogin(){

loginForm.classList.remove("hidden");

registerForm.classList.add("hidden");

loginTab.classList.add("active");

registerTab.classList.remove("active");

message.innerText="";

}


/* ---------- TELA CADASTRO ---------- */

function showRegister(){

loginForm.classList.add("hidden");

registerForm.classList.remove("hidden");

loginTab.classList.remove("active");

registerTab.classList.add("active");

message.innerText="";

}


/* ---------- HASH DE SENHA ---------- */

async function hashPassword(password){

const data=
new TextEncoder().encode(password);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return Array
.from(new Uint8Array(hash))
.map(
b=>b.toString(16).padStart(2,"0")
)
.join("");

}


/* ---------- CADASTRO ---------- */

async function register(){

const name=
document.getElementById("registerName")
.value.trim();

const username=
document.getElementById("registerUser")
.value.trim()
.toLowerCase();

const password=
document.getElementById("registerPassword")
.value;

const password2=
document.getElementById("registerPassword2")
.value;


if(password!==password2){

message.innerText=
"As senhas não coincidem.";

return;

}


if(password.length<6){

message.innerText=
"A senha precisa ter pelo menos 6 caracteres.";

return;

}


const users=
JSON.parse(
localStorage.getItem("cmUsers")
||"[]"
);


if(
users.some(
u=>u.username===username
)
){

message.innerText=
"Esse usuário já existe.";

return;

}


const passwordHash=
await hashPassword(password);


const user={

id:
"CM-"+Date.now(),

name,

username,

passwordHash,

createdAt:
new Date().toISOString(),

active:true,

xp:0,

level:1,

completed:0,

progress:{},

medals:[]

};


users.push(user);


localStorage.setItem(
"cmUsers",
JSON.stringify(users)
);


localStorage.setItem(
"cmSession",
JSON.stringify({
id:user.id,
username:user.username
})
);


message.style.color="#45ff9a";

message.innerText=
"Conta criada. Entrando...";


setTimeout(
()=>{
window.location.href="painel.html";
},
600
);

}


/* ---------- LOGIN ---------- */

async function login(){

const username=
document.getElementById("loginUser")
.value.trim()
.toLowerCase();

const password=
document.getElementById("loginPassword")
.value;


const passwordHash=
await hashPassword(password);


const users=
JSON.parse(
localStorage.getItem("cmUsers")
||"[]"
);


let user=
users.find(
u=>
u.username===username &&
u.passwordHash===passwordHash
);


if(!user){

/* CONTA DEMONSTRAÇÃO */

if(
username==="demo" &&
password==="cyber123"
){

user={

id:"CM-DEMO",

name:"Aluno Demo",

username:"demo",

passwordHash,

createdAt:
new Date().toISOString(),

active:true,

xp:0,

level:1,

completed:0,

progress:{},

medals:[]

};

}else{

message.innerText=
"Usuário ou senha incorretos.";

return;

}

}


if(user.active===false){

message.innerText=
"Esta conta está bloqueada.";

return;

}


localStorage.setItem(
"cmSession",
JSON.stringify({
id:user.id,
username:user.username
})
);


message.style.color="#45ff9a";

message.innerText=
"Login autorizado. Entrando...";


setTimeout(
()=>{
window.location.href="painel.html";
},
500
);

}


/* ---------- VERIFICAÇÃO DE SESSÃO ---------- */

const session=
localStorage.getItem("cmSession");


/*
Se já estiver logado, o usuário não precisa
voltar para a tela de login.
*/

if(session){

/*
Não redirecionamos automaticamente aqui
para evitar loops durante a primeira instalação.
*/

}

</script>

</body>
</html>
