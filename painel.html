<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☠️ Cyber Mafia Professional</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#030705;
  color:#eafff1;
  font-family:Arial,sans-serif;
}

header{
  padding:15px 5%;
  background:#07100b;
  border-bottom:1px solid #245a38;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#45ff9a;
  font-weight:bold;
  font-size:20px;
}

button{
  cursor:pointer;
}

.logout{
  background:#16080b;
  color:#ff6479;
  border:1px solid #743141;
  padding:8px 12px;
  border-radius:8px;
}

.container{
  width:92%;
  max-width:1100px;
  margin:25px auto;
}

.hero,.box,.phase,.question{
  background:#09130d;
  border:1px solid #214a30;
  border-radius:15px;
}

.hero{
  padding:25px;
}

h1,h2{
  color:#45ff9a;
}

.muted{
  color:#83a18d;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:20px;
}

.stat{
  background:#050b07;
  border:1px solid #214a30;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.stat b{
  display:block;
  color:#45ff9a;
  font-size:24px;
}

.progress{
  height:8px;
  background:#142219;
  border-radius:20px;
  margin-top:10px;
  overflow:hidden;
}

.progress div{
  height:100%;
  background:#45ff9a;
  width:0%;
}

.phases{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
  margin-top:15px;
}

.phase{
  padding:20px;
  transition:.2s;
}

.phase:hover{
  border-color:#45ff9a;
  transform:translateY(-2px);
}

.phase.locked{
  opacity:.45;
  cursor:not-allowed;
}

.phase .icon{
  font-size:32px;
}

.phase button{
  width:100%;
  padding:11px;
  margin-top:15px;
  background:#45ff9a;
  color:#031008;
  border:0;
  border-radius:8px;
  font-weight:bold;
}

.phase.locked button{
  background:#27342b;
  color:#82948a;
}

.hidden{
  display:none!important;
}

.question{
  padding:25px;
}

.back{
  background:#0d1a12;
  color:white;
  border:1px solid #285238;
  padding:9px 13px;
  border-radius:8px;
  margin-bottom:20px;
}

.meta{
  color:#80a78d;
  font-size:12px;
}

.questionText{
  font-size:20px;
  line-height:1.6;
  margin:18px 0;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  background:#050b07;
  color:#eafff1;
  border:1px solid #285238;
  padding:15px;
  text-align:left;
  border-radius:9px;
}

.option:hover{
  border-color:#45ff9a;
}

.correct{
  background:#0b321b!important;
  border-color:#45ff9a!important;
}

.wrong{
  background:#321018!important;
  border-color:#ff536d!important;
}

.explanation{
  margin-top:20px;
  padding:18px;
  border-left:3px solid #45ff9a;
  background:#0b1910;
  line-height:1.6;
}

.next{
  margin-top:15px;
  padding:12px 18px;
  background:#45ff9a;
  border:0;
  border-radius:8px;
  font-weight:bold;
}

.search{
  width:100%;
  margin:20px 0;
  padding:13px;
  background:#050b07;
  color:white;
  border:1px solid #285238;
  border-radius:8px;
}

#results{
  display:grid;
  gap:8px;
}

.result{
  background:#09130d;
  border:1px solid #214a30;
  padding:12px;
  border-radius:8px;
}

@media(max-width:600px){

  header{
    padding:13px;
  }

  .logo{
    font-size:16px;
  }

  .container{
    width:94%;
  }

  .questionText{
    font-size:17px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    ☠️ CYBER MAFIA
  </div>

  <div>
    <span id="userName">Aluno</span>

    <button
      class="logout"
      onclick="logout()">
      SAIR
    </button>
  </div>

</header>


<div class="container">

<!-- =========================
     DASHBOARD
========================= -->

<section id="dashboard">

  <div class="hero">

    <div class="muted">
      PAINEL DO OPERADOR
    </div>

    <h1>
      CYBER MAFIA PROFESSIONAL
    </h1>

    <p class="muted">
      Academia interativa de cibersegurança.
    </p>

    <div class="stats">

      <div class="stat">
        <b id="xp">0</b>
        XP
      </div>

      <div class="stat">
        <b id="completed">0</b>
        DESAFIOS
      </div>

      <div class="stat">
        <b id="level">1</b>
        NÍVEL
      </div>

    </div>

    <p style="margin-top:20px">
      Progresso geral:
      <span id="percent">0%</span>
    </p>

    <div class="progress">
      <div id="globalProgress"></div>
    </div>

  </div>


  <h2>
    🌐 FASES
  </h2>

  <div
    id="phases"
    class="phases">
  </div>


  <h2>
    🔎 Pesquisar desafios
  </h2>

  <input
    id="search"
    class="search"
    placeholder="Digite uma palavra para pesquisar..."
    oninput="searchChallenges()">

  <div id="results"></div>

</section>


<!-- =========================
     DESAFIOS
========================= -->

<section
  id="challengeScreen"
  class="hidden">

  <div class="question">

    <button
      class="back"
      onclick="backDashboard()">
      ← VOLTAR
    </button>

    <div
      id="challengeContent">
    </div>

  </div>

</section>

</div>


<!-- =====================================================
     PRIMEIRO: CARREGA O BANCO
===================================================== -->

<script src="desafios.js"></script>


<script>

/* =====================================================
   CYBER MAFIA — CONTROLE DO PAINEL
===================================================== */


/* =========================
   VERIFICAR BANCO
========================= */

if(typeof challenges === "undefined"){

  document.body.innerHTML=`

    <div style="
      padding:40px;
      color:#ff536d;
      font-family:Arial">

      <h1>Erro ao carregar desafios.js</h1>

      <p>
        Verifique se desafios.js está na mesma pasta
        que painel.html.
      </p>

    </div>

  `;

  throw new Error(
    "desafios.js não carregado"
  );

}


/* =========================
   SESSÃO
========================= */

let session=
JSON.parse(
  localStorage.getItem("cmSession")||"null"
);


/*
 Se ainda não existir sessão,
 não bloqueamos o painel.
 Isso permite testar o curso.
*/

if(!session){

  session={
    id:"local-user",
    username:"Aluno"
  };

}


/* =========================
   USUÁRIO
========================= */

let users=
JSON.parse(
  localStorage.getItem("cmUsers")||"[]"
);

let user=
users.find(
  x=>x.id===session.id
);

if(!user){

  user={
    id:session.id,
    username:session.username||"Aluno",
    xp:0,
    completed:0,
    answered:{},
    phaseProgress:{}
  };

  users.push(user);

}


/* =========================
   VARIÁVEIS
========================= */

let xp=user.xp||0;

let completed=user.completed||0;

let answered=user.answered||{};

let phaseProgress=
user.phaseProgress||{};

let currentPhase=0;

let currentIndex=0;


/* =========================
   SALVAR
========================= */

function save(){

  user.xp=xp;

  user.completed=completed;

  user.answered=answered;

  user.phaseProgress=phaseProgress;

  const index=
    users.findIndex(
      x=>x.id===user.id
    );

  if(index>=0)
    users[index]=user;

  localStorage.setItem(
    "cmUsers",
    JSON.stringify(users)
  );

}


/* =========================
   ESTATÍSTICAS
========================= */

function updateStats(){

  document.getElementById("userName")
    .textContent=
    user.username;

  document.getElementById("xp")
    .textContent=xp;

  document.getElementById("completed")
    .textContent=completed;

  document.getElementById("level")
    .textContent=
    Math.floor(xp/100)+1;

  const pct=
    Math.min(
      100,
      Math.round(
        completed/500*100
      )
    );

  document.getElementById("percent")
    .textContent=pct+"%";

  document.getElementById("globalProgress")
    .style.width=pct+"%";

}


/* =========================
   FASE DESBLOQUEADA
========================= */

function phaseUnlocked(phase){

  if(phase===1)
    return true;

  return (
    (phaseProgress[phase-1]||0)>=80
  );

}


/* =========================
   RENDER FASES
========================= */

function renderPhases(){

  const box=
    document.getElementById("phases");

  box.innerHTML="";

  const infos=[

    ["🌐","Redes & Fundamentos"],
    ["🐧","Linux & Sistemas"],
    ["🛡️","Segurança da Informação"],
    ["⚔️","Hacking Ético & Pentest"],
    ["🚩","Laboratório & CTF"]

  ];

  for(let phase=1;phase<=5;phase++){

    const unlocked=
      phaseUnlocked(phase);

    const done=
      phaseProgress[phase]||0;

    const card=
      document.createElement("div");

    card.className=
      "phase "+
      (unlocked?"":"locked");

    card.innerHTML=`

      <div class="icon">
        ${infos[phase-1][0]}
      </div>

      <h3>
        FASE ${phase}
      </h3>

      <h3>
        ${infos[phase-1][1]}
      </h3>

      <p class="muted">
        ${done}/100 desafios concluídos
      </p>

      <div class="progress">
        <div
          style="width:${done}%">
        </div>
      </div>

      <button
        ${unlocked?"":"disabled"}
        onclick="openPhase(${phase})">

        ${unlocked
          ?"ENTRAR NA FASE"
          :"🔒 BLOQUEADA"}

      </button>

    `;

    box.appendChild(card);

  }

}


/* =========================
   ABRIR FASE
========================= */

function openPhase(phase){

  const list=
    challengesByPhase[phase];

  if(!list){

    alert(
      "Esta fase não foi encontrada."
    );

    return;

  }

  currentPhase=phase;

  /*
   Retoma do ponto salvo.
  */

  currentIndex=
    phaseProgress[phase]||0;

  /*
   Se completou 100, começa novamente
   no último desafio para revisão.
  */

  if(currentIndex>=100)
    currentIndex=99;

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("challengeScreen")
    .classList.remove("hidden");

  renderChallenge();

}


/* =========================
   RENDER DESAFIO
========================= */

function renderChallenge(){

  const list=
    challengesByPhase[currentPhase];

  const q=
    list[currentIndex];

  if(!q){

    finishPhase();

    return;

  }

  const alreadyAnswered=
    answered[q.id];

  let html=`

    <div class="meta">
      FASE ${currentPhase}
      • DESAFIO ${currentIndex+1}/100
      • ${q.difficulty}
      • +${q.xp} XP
    </div>

    <h2>
      ${escapeHTML(q.title)}
    </h2>

    <div class="questionText">
      ${escapeHTML(q.question)}
    </div>

    <div class="options">

  `;

  for(const letter of ["A","B","C","D","E"]){

    let className="option";

    if(alreadyAnswered){

      if(letter===q.answer)
        className+=" correct";

      if(letter===alreadyAnswered &&
         letter!==q.answer)
        className+=" wrong";

    }

    html+=`

      <button
        class="${className}"
        ${alreadyAnswered?"disabled":""}
        onclick="answer('${letter}')">

        <b>${letter})</b>
        ${escapeHTML(q.options[letter])}

      </button>

    `;

  }

  html+=`</div>`;

  if(alreadyAnswered){

    html+=`

      <div class="explanation">

        <b>
          ${alreadyAnswered===q.answer
            ?"✅ Resposta correta!"
            :"❌ Resposta incorreta"}
        </b>

        <br><br>

        <b>
          Gabarito: ${q.answer}
        </b>

        <br><br>

        ${escapeHTML(q.explanation)}

      </div>

      <button
        class="next"
        onclick="nextChallenge()">

        ${
          currentIndex===99
          ?"FINALIZAR FASE"
          :"PRÓXIMO DESAFIO →"
        }

      </button>

    `;

  }

  document.getElementById(
    "challengeContent"
  ).innerHTML=html;

}


/* =========================
   RESPONDER
========================= */

function answer(letter){

  const q=
    challengesByPhase[currentPhase][currentIndex];

  if(answered[q.id])
    return;

  answered[q.id]=letter;

  if(letter===q.answer){

    xp+=q.xp;

    completed++;

  }

  /*
   Conta quantos desafios daquela fase
   já foram respondidos.
  */

  phaseProgress[currentPhase]=
    challengesByPhase[currentPhase]
      .filter(x=>answered[x.id])
      .length;

  save();

  updateStats();

  renderChallenge();

}


/* =========================
   PRÓXIMO
========================= */

function nextChallenge(){

  if(currentIndex>=99){

    phaseProgress[currentPhase]=100;

    save();

    updateStats();

    alert(
      "🏆 Fase concluída! A próxima fase foi liberada."
    );

    backDashboard();

    return;

  }

  currentIndex++;

  renderChallenge();

}


/* =========================
   FINALIZAR
========================= */

function finishPhase(){

  phaseProgress[currentPhase]=100;

  save();

  backDashboard();

}


/* =========================
   VOLTAR
========================= */

function backDashboard(){

  document
    .getElementById("challengeScreen")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  updateStats();

  renderPhases();

}


/* =========================
   PESQUISA
========================= */

function searchChallenges(){

  const value=
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const results=
    document.getElementById("results");

  results.innerHTML="";

  if(!value)
    return;

  const found=
    challenges
      .filter(q=>
        q.title.toLowerCase().includes(value)||
        q.question.toLowerCase().includes(value)
      )
      .slice(0,20);

  found.forEach(q=>{

    const div=
      document.createElement("div");

    div.className="result";

    div.innerHTML=`

      <b>
        Fase ${q.phase} —
        Desafio ${q.number}
      </b>

      <br>

      ${escapeHTML(q.title)}

    `;

    results.appendChild(div);

  });

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "cmSession"
  );

  location.href="index.html";

}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   INICIAR
========================= */

save();

updateStats();

renderPhases();

</script>

</body>
</html>
